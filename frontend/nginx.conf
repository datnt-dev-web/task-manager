# Nginx trong container web: phục vụ SPA + proxy /api sang container api.
# TLS do Nginx trên máy chủ đảm nhiệm (deploy/nginx/beta.hopphu.vn.conf).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # 10 tệp × 10 MB mỗi lần tải lên
  client_max_body_size 105m;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always; # cho phép xem PDF trong iframe cùng tên miền
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location = /healthz {
    access_log off;
    return 200 'ok';
  }

  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 60s;
    proxy_request_buffering off;
  }

  # Tệp build có hash trong tên → cache lâu dài
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA: mọi đường dẫn khác trả index.html, không cache để luôn nhận bản mới
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
