# Production trên VPS: docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.production up -d --build
# Nginx trên máy chủ (TLS) → web:80 (127.0.0.1:8090) → api:4000 → postgres:5432
name: taskmanager

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskmanager
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Cần đặt POSTGRES_PASSWORD trong deploy/.env.production}
      POSTGRES_DB: taskmanager
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Không mở cổng ra ngoài (spec 8.1)
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U taskmanager']
      interval: 10s
      retries: 10

  api:
    build: ../backend
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://taskmanager:${POSTGRES_PASSWORD}@postgres:5432/taskmanager
      UPLOAD_DIR: /app/uploads
      TRUST_PROXY: 2
      ALLOW_DEV_LOGIN: 'false'
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ../frontend
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    restart: unless-stopped
    ports:
      - '127.0.0.1:8090:80' # 8080 đã bị app khác dùng trên VPS; chỉ Nginx trên máy chủ truy cập được
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
