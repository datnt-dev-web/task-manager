# Nginx trên máy chủ: /etc/nginx/sites-available/beta.hopphu.vn
# Chứng chỉ do certbot cấp (sudo certbot --nginx -d beta.hopphu.vn) — certbot sẽ tự thêm các dòng ssl_*.

server {
  listen 80;
  listen [::]:80;
  server_name beta.hopphu.vn;

  # certbot dùng đường dẫn này để xác minh tên miền
  location /.well-known/acme-challenge/ { root /var/www/html; }

  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name beta.hopphu.vn;

  # Các dòng dưới đây sẽ được certbot điền:
  # ssl_certificate     /etc/letsencrypt/live/beta.hopphu.vn/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/beta.hopphu.vn/privkey.pem;
  # include /etc/letsencrypt/options-ssl-nginx.conf;
  # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  add_header Strict-Transport-Security "max-age=31536000" always;
  client_max_body_size 105m;

  location / {
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_request_buffering off;
  }
}
