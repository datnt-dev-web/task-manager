# CI/CD: kiểm thử mọi push/PR; push lên main thì deploy lên beta.hopphu.vn.
# Secrets cần tạo (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST     103.175.146.251
#   DEPLOY_USER     deploy              (người dùng riêng, KHÔNG dùng root)
#   DEPLOY_SSH_KEY  private key ứng với public key trong ~deploy/.ssh/authorized_keys
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — migration + smoke test API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: taskmanager
          POSTGRES_PASSWORD: taskmanager
          POSTGRES_DB: taskmanager
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U taskmanager" --health-interval 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://taskmanager:taskmanager@localhost:5432/taskmanager
      JWT_ACCESS_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      ALLOW_DEV_LOGIN: 'true'
      INITIAL_ADMIN_EMAIL: admin@example.com
      UPLOAD_DIR: /tmp/uploads
      ENABLE_JOBS: 'false'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run db:migrate && npm run db:seed
      - name: Khởi động API
        run: |
          node src/server.js > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:4000/api/v1/health && break; sleep 1; done
      - run: npm run test:smoke
      - name: Log API khi lỗi
        if: failure()
        run: cat /tmp/api.log

  frontend:
    name: Frontend — typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    name: Docker — build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t taskmanager-api ./backend
      - run: docker build -t taskmanager-web ./frontend

  deploy:
    name: Deploy beta.hopphu.vn
    needs: [backend, frontend, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: SSH và chạy deploy.sh
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: /opt/task-manager/deploy/deploy.sh
